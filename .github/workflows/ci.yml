name: CI - Paradigmas

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pipeline CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar o JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar o Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Permitir a execução do Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar e executar os testes
        run: ./gradlew clean test build --no-daemon
